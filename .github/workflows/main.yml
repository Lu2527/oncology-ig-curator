name: Daily Oncology IG Curator (08:00 AM Taiwan Time)

on:
  schedule:
    # 每天 UTC 00:00 自動執行（對應台灣時間 Asia/Taipei 早上 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵觸發測試

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  curate-and-render:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Oncology News & Curate 5 Posts via Claude / Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 cloud_curate.py

      - name: Archive Today's Posts (for history browsing & weekly newsletter)
        run: |
          python3 archive_daily.py

      - name: Render 20 High-Res 1080x1350 PNG Carousel Cards
        run: |
          mkdir -p docs/cards
          osascript -l JavaScript render_cards.js docs/data/daily_posts.json docs/cards
          sips -Z 1350 docs/cards/*.png

      - name: Commit & Push Updated Cards and Data to GitHub Pages
        run: |
          git config user.name "Oncology IG Curator Bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/ data/
          git diff --staged --quiet || git commit -m "chore: update daily 5 oncology IG posts ($(date +'%Y-%m-%d'))"
          # 網頁上按「⭐ 加入本週週報」會直接寫入 repo，推送前先 rebase 避免衝突
          git pull --rebase origin main
          git push
